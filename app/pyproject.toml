[tool.poetry]
name = "app"
version = "0.1.0"
description = ""
authors = ["mattyocode"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
Django = "5.2.19"
djangorestframework = "3.18.3"
psycopg2-binary = "2.9.13"
gunicorn = "27.0.1"
whitenoise = "6.12.0"
django-cors-headers = "^4.9.0"
djangorestframework-simplejwt = "^5.5.1"
requests = "^2.33.0"
django-ses = "4.9.1"
redis = "^8.2.0"
celery = "^5.7.0"
django-filter = "^26.2"
pgvector = "^0.5.1"
fastembed = "^0.9.1"

[tool.poetry.group.dev.dependencies]
pytest = "9.2.0"
pytest-django = "4.14.0"
pytest-factoryboy = "^2.8.1"
pytest-cov = "^7.1.0"
flake8 = "^7.5.0"
black = "26.10.1"
isort = "9.0.2"
pytest-mock = "^3.17.0"
pytest-env = "^1.8.8"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
multi_line_output=3
include_trailing_comma=true