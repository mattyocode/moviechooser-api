name: CI
on:
  push:
    branches:
      - "**"
      - "!main"
  pull_request:
    branches:
      - "**"
      - "!main"

env:
  WEB_IMAGE: ghcr.io/${{ github.actor }}/${{ github.repository }}
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholder for collectstatic. Real configuration is
      # passed to the container at run time; none of it goes in the image.
      SECRET_KEY: foosecretkeyforbuildtimeonly
      DEBUG: 0

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.WEB_IMAGE }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: app
          file: app/Dockerfile.prod
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha, scope=${{ github.workflow }}
          cache-to: type=gha, scope=${{ github.workflow }}
          build-args: |
            SECRET_KEY=${{ env.SECRET_KEY }}

      - name: Show image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  test:
    runs-on: ubuntu-latest
    needs: build
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DJANGO_ALLOWED_HOSTS: localhost 127.0.0.1
      SQL_ENGINE: ${{ secrets.SQL_ENGINE }}
      SQL_DATABASE: ci_db_test
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_HOST: localhost
      SQL_PORT: 5432
      DATABASE: postgres
      DJANGO_SETTINGS_MODULE: config.settings.prod

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: ci_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Branch name if push
        if: github.event_name == 'push'
        run: |
          echo "BRANCH_REF=${GITHUB_BASE_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_ENV
          ${{ env.BRANCH_REF}}

      - name: Branch name if pull_request
        if: github.event_name == 'pull_request'
        run: |
          echo "BRANCH_REF=${{ github.head_ref }}" >> $GITHUB_ENV
          ${{ env.BRANCH_REF}}

      # Host network so the container reaches the pgvector service on localhost.
      # Without the SQL_* vars, settings fall back to SQLite and the pgvector
      # migration fails.
      - name: Pull image and run container
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SQL_ENGINE: django.db.backends.postgresql
        run: |
          docker pull ${{ env.WEB_IMAGE }}:${{ env.BRANCH_REF}}
          docker run -d --network host -e SECRET_KEY="$SECRET_KEY" \
            -e SQL_ENGINE -e SQL_DATABASE -e SQL_USER -e SQL_PASSWORD \
            -e SQL_HOST -e SQL_PORT -e DATABASE \
            --name latest_image ${{ env.WEB_IMAGE }}:"${{ env.BRANCH_REF}}"

      # Images must not contain env files. Checks the pulled image itself, so
      # it doesn't depend on the app container booting.
      - name: Check image has no env files
        run: |
          docker run --rm --entrypoint sh ${{ env.WEB_IMAGE }}:"${{ env.BRANCH_REF}}" -c \
            'found=$(find /app -name ".env*" ! -name ".env.example" ! -name ".env.db.example"); if [ -n "$found" ]; then echo "Env files in image: $found"; exit 1; fi; echo "No env files in image"'

      - name: Run tests
        run: |
          docker exec -u root -e DEBUG=1 latest_image pytest -vv -p no:cacheprovider -p no:warnings --cov=.
          docker exec -u root latest_image flake8
          docker exec -u root latest_image black --check --exclude=migrations .
          docker exec -u root latest_image isort . --check-only

      - name: Run django tests
        env:
          DEBUG: 0
        run: |
          echo DEBUG "$DEBUG"
          docker exec -u root -e DEBUG=0 latest_image python manage.py check --deploy --fail-level=WARNING
