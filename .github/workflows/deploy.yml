name: CI
on:
  push:
    branches:
      - main

# Pushes to the mutable :main tag and deploys. Queue runs instead of
# overlapping them, so runs push and deploy in order. Re-running an old run
# isn't covered by this; the push step checks that the commit is still main's
# tip before moving :main, and only then is it deployed.
concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mattyocode/mattyocode/moviechooser-api
  TEST_IMAGE: moviechooser-api:test
  RUNTIME_IMAGE: moviechooser-api:runtime

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.push.outputs.ref }}
      deploy: ${{ steps.push.outputs.deploy }}
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DJANGO_ALLOWED_HOSTS: localhost 127.0.0.1
      SQL_ENGINE: django.db.backends.postgresql
      SQL_DATABASE: ci_db_test
      SQL_USER: postgres
      SQL_PASSWORD: postgres
      SQL_HOST: localhost
      SQL_PORT: 5432

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: ci_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate prod compose file
        run: |
          touch .env.prod .env.prod.db .env.tunnel
          docker compose -f docker-compose.prod.yml config -q

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      # The test target is the runtime image plus the dev dependencies.
      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: app
          file: app/Dockerfile.prod
          target: test
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: |
            type=gha,scope=api-test
            type=gha,scope=api-runtime
          cache-to: type=gha,mode=max,scope=api-test

      # Host network so the container reaches the pgvector service on localhost.
      - name: Start test container
        run: |
          docker run -d --network host --name test_image --entrypoint sleep \
            -e SECRET_KEY -e DJANGO_ALLOWED_HOSTS \
            -e SQL_ENGINE -e SQL_DATABASE -e SQL_USER -e SQL_PASSWORD \
            -e SQL_HOST -e SQL_PORT \
            ${{ env.TEST_IMAGE }} infinity

      - name: Run tests
        run: |
          docker exec -e DEBUG=1 test_image pytest -vv -p no:cacheprovider -p no:warnings --cov=.
          docker exec test_image flake8
          docker exec test_image black --check --exclude=migrations .
          docker exec test_image isort . --check-only

      - name: Run django deploy checks
        run: docker exec -e DEBUG=0 test_image python manage.py check --deploy --fail-level=WARNING

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build runtime image
        uses: docker/build-push-action@v5
        with:
          context: app
          file: app/Dockerfile.prod
          target: runtime
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          tags: |
            ${{ env.RUNTIME_IMAGE }}
            ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=api-runtime
          cache-to: type=gha,mode=max,scope=api-runtime

      - name: Show runtime image size
        run: docker image ls ${{ env.RUNTIME_IMAGE }}

      # Images must not contain env files.
      - name: Check image has no env files
        run: |
          docker run --rm --entrypoint sh ${{ env.RUNTIME_IMAGE }} -c \
            'found=$(find /app -name ".env*" ! -name ".env.example" ! -name ".env.db.example"); if [ -n "$found" ]; then echo "Env files in image: $found"; exit 1; fi; echo "No env files in image"'

      - name: Check image runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id ${{ env.RUNTIME_IMAGE }} -u)
          echo "Runtime UID: $uid"
          if [ "$uid" = "0" ]; then echo "Runtime image runs as root"; exit 1; fi

      # Boot the image that gets pushed, as the server will: migrate, real
      # entrypoint, non-root, health check and embedding model load.
      - name: Smoke test runtime image
        run: sh .github/scripts/smoke-runtime.sh ${{ env.RUNTIME_IMAGE }}

      # deploy.sh against a throwaway stack: deploy, failed migration, rollback
      # of an unhealthy api, lock, frontend deploy.
      - name: Test deploy script
        run: sh deploy/test-deploy.sh ${{ env.RUNTIME_IMAGE }}

      # Push only after every check above passed, and push the image that was
      # checked (the runtime target), never the test target.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha- tags are immutable, so always push them. Only move :main if this
      # commit is still main's tip: a re-run of an older run must not roll the
      # tag back.
      - name: Push runtime image
        id: push
        env:
          TAGS: ${{ steps.docker_meta.outputs.tags }}
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          deploy=true
          for tag in $TAGS; do
            if [ "$tag" = "$IMAGE:main" ] && [ "$tip" != "$GITHUB_SHA" ]; then
              echo "::warning::Not moving $IMAGE:main or deploying: $GITHUB_SHA is no longer main's tip ($tip)"
              deploy=false
              continue
            fi
            docker push "$tag"
          done
          # RepoDigests also lists the local name; take the GHCR one.
          ref=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$RUNTIME_IMAGE" | grep "^$IMAGE@sha256:")
          echo "Pushed $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  # Joins the tailnet as tag:ci and deploys over Tailscale SSH (docs/deploy.md).
  deploy:
    needs: build-test
    if: needs.build-test.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://moviechooser.co.uk
    permissions:
      contents: read
    env:
      IMAGE_REF: ${{ needs.build-test.outputs.image-ref }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_HOST }}

      # Tailscale SSH: the tailnet already authenticates the server (WireGuard
      # keys), and the runner is new every time, so don't pin a host key.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host prod
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF

      # The compose file and deploy script live here, so ship them with every
      # api deploy. The frontend repo's deploy uses whatever is on the server.
      - name: Copy compose file and deploy script
        run: rsync --chmod=F644 docker-compose.prod.yml deploy/deploy.sh prod:/srv/moviechooser/

      - name: Deploy
        run: |
          # shellcheck disable=SC2029 # $IMAGE_REF is meant to expand on the runner
          ssh prod sh /srv/moviechooser/deploy.sh api "$IMAGE_REF"
