version: "3.8"

services:
  djangogunicorn:
    build:
      context: ./app
      dockerfile: Dockerfile.inst.prod
    volumes:
      - ./app/:/app/
      - static_volume:/app/web/staticfiles
      - media_volume:/app/web/mediafiles
    expose:
      - "8000"
    env_file:
      - ./app/.env.staging
    depends_on:
      mc-staging-db:
        condition: service_healthy

  mc-staging-db:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./app/.env.staging.db
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 3s
      retries: 3

  # Broker only: queued messages are short-lived and beat re-queues on
  # schedule, so nothing is persisted.
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    restart: always

  # The Celery services override the entrypoint so they never run migrate or
  # start gunicorn (entrypoint.prod.sh does both). One task at a time keeps
  # memory bounded: each prefork child is a full Django process.
  celery-worker:
    build:
      context: ./app
      dockerfile: Dockerfile.inst.prod
    entrypoint: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=1"]
    restart: always
    env_file:
      - ./app/.env.staging
    depends_on:
      mc-staging-db:
        condition: service_healthy
      redis:
        condition: service_started

  # Exactly one beat process: a second would queue every scheduled job twice.
  celery-beat:
    build:
      context: ./app
      dockerfile: Dockerfile.inst.prod
    entrypoint: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    restart: always
    env_file:
      - ./app/.env.staging
    depends_on:
      redis:
        condition: service_started

  nginx-proxy:
    container_name: nginx-proxy
    build: ./nginx
    restart: always
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - static_volume:/app/web/staticfiles
      - media_volume:/app/web/mediafiles
      - certs:/etc/nginx/certs
      - html:/usr/share/nginx/html
      - vhost:/etc/nginx/vhost.d
      - /var/run/docker.sock:/tmp/docker.sock:ro
    depends_on:
      - djangogunicorn

  nginx-proxy-letsencrypt:
    image: nginxproxy/acme-companion
    env_file:
      - ./nginx/.env.staging.proxy-companion
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - html:/usr/share/nginx/html
      - vhost:/etc/nginx/vhost.d
      - acme:/etc/acme.sh
    depends_on:
      - nginx-proxy

volumes:
  postgres_data:
  static_volume:
  media_volume:
  certs:
  html:
  vhost:
  acme:
