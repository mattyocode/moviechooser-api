# Production stack on the Hetzner server, run from /srv/moviechooser next to
# its env files (.env, .env.prod, .env.prod.db, .env.tunnel).
#
# Traffic: Cloudflare Tunnel -> cloudflared -> frontend (nginx :8080) -> api
# (gunicorn :8000). No container publishes a port.
#
# Migrations are not run on start: the deploy runs `migrate` and
# `createcachetable` with the new image before swapping containers.
name: moviechooser

x-api-image: &api-image ghcr.io/mattyocode/mattyocode/moviechooser-api:${API_TAG:-main}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env.prod.db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Broker only: queued messages are short-lived and beat re-queues on schedule.
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    restart: unless-stopped

  api:
    image: *api-image
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/api/health/', headers={'Host': 'moviechooser.co.uk'}), timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 60s

  # Overrides the entrypoint, so it never starts gunicorn. One task at a time
  # keeps memory bounded: each prefork child is a full Django process.
  celery-worker:
    image: *api-image
    entrypoint: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=1"]
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Exactly one beat process: a second would queue every scheduled job twice.
  celery-beat:
    image: *api-image
    entrypoint: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      redis:
        condition: service_started

  frontend:
    image: ghcr.io/mattyocode/react-moviechooser:${FRONTEND_TAG:-main}
    restart: unless-stopped
    depends_on:
      - api

  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    command: ["tunnel", "--no-autoupdate", "run"]
    restart: unless-stopped
    env_file: .env.tunnel
    depends_on:
      - frontend

volumes:
  postgres_data:
